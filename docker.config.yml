server:
    bind:
        host: 0.0.0.0
        port: 80
    url: http://localhost:5001
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    map:
        url: https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg
        attribution: '&copy; &lt;a href="https://openstreetmap.org/copyright"&gt;OpenStreetMap
            contributors&lt;/a&gt;'
    languages:
    - pt-PT
    - en-US
    gzip: false
    pretty_print: true
    admin: true # Handle with care: this should not be enabled in unprotected, publicly exposed, instances!
    cors: true
    limits:
        default_items: 20
        max_items: 50
    templates:
        path: /pygeoapi/themes/hand-drawn/templates
        static: /pygeoapi/themes/hand-drawn/static
logging:
    level: DEBUG
metadata:
    identification:
        title:
            en: pygeoapi config plugin instance
            pt: Instância de defeito da pygeoapi
        description:
            pt: A pygeoapi oferece uma API para dados geospaciais
            en: pygeoapi provides an API to geospatial data
        keywords:
            en:
            - api
            - data
            - geospatial
            - plugin
            - qgis
            pt:
            - api
            - dados
            - geospacial
        url: https://example.org
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: Organization Name
        url: https://pygeoapi.io
    contact:
        name: Lastname, Firstname
        position: Position Title
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: you@example.org
        url: Contact URL
        hours: Mo-Fr 08:00-17:00
        instructions: During hours of service. Off on weekends.
        role: pointOfContact
resources:
    distritos:
        type: collection
        title: CAOP2024 Distritos
        description: Carta Administrativa Oficial de Portugal, Continente, 2024. Distritos
        keywords:
        - Limites Admnistrativos
        - Portugal Continental
        - Distritos
        - CAOP
        extents:
            spatial:
                bbox: [-9.51, 36.96, -6.19, 42.15]
                crs: http://www.opengis.net/def/crs/EPSG/0/4326
        providers:
        -   type: map
            name: WMSFacade
            data: https://geo2.dgterritorio.gov.pt/geoserver/caop_continente/wms
            options:
                layer: cont_distritos
                version: 1.3.0
                style: CAOP_Distrito
            format:
                name: png
                mimetype: image/png
        -   type: feature
            name: SQLiteGPKG
            data: /data/cont_distritos.gpkg
            id_field: fid
            table: cont_distritos
        links:
        -   type: text/csv
            rel: canonical
            href: https://snig.dgterritorio.gov.pt/rndg/srv/por/catalog.search#/metadata/198497815bf647ecaa990c34c42e932e
            title: data
            hreflang: en-US

    crus_obidos:
        type: collection
        title: CRUS ÓBIDOS
        description: Carta do Regime de Uso do Solo - ÓBIDOS
        keywords:
        - Uso do Solo
        - Portugal
        - CRUS
        - ÓBIDOS
        extents:
            spatial:
                bbox: [-9.292006908408782, 39.305959402967964, -9.065505526239146,
                    39.42785060392488]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
        -   type: feature
            name: PostgreSQL
            data:
                host: postgis
                dbname: postgres
                user: postgres
                port: 5432
                search_path:
                - public
            id_field: id
            table: crus_obidos
            geom_field: geom
        -   type: tile
            name: MVT-postgresql
            data:
                host: postgis
                port: 5432
                dbname: postgres
                user: postgres
                search_path:
                - public
            id_field: id
            table: crus_obidos
            geom_field: geom
            options:
                zoom:
                    min: 0
                    max: 15
            format:
                name: pbf
                mimetype: application/vnd.mapbox-vector-tile
        links:
        -   type: text/csv
            rel: canonical
            href: https://snig.dgterritorio.gov.pt/rndg/srv/por/catalog.search#/metadata/517c5023-04cc-47a4-99f7-bb32814dd62f
            title: data
            hreflang: en-US
